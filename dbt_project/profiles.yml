brewery_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'airflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'airflow123') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'breweries') }}"
      schema: breweries
      threads: 4
      keepalives_idle: 0
