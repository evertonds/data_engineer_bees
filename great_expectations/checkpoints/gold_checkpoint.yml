# Gold Layer Validation Checkpoint
# Validates Gold aggregations and business metrics
# Philosophy: Ensure aggregation correctness and business KPI quality

name: gold_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
module_name: great_expectations.checkpoint

validations:
  - batch_request:
      datasource_name: gold_datasource
      data_connector_name: gold_table_connector
      data_asset_name: gold_breweries_by_type_location
    expectation_suite_name: gold_breweries_suite

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
  - name: send_slack_notification_on_validation_result
    action:
      class_name: SlackNotificationAction
      # Slack webhook URL should be configured via environment variable
      # slack_webhook: ${SLACK_WEBHOOK_URL}
      notify_on: failure

# Evaluation parameters
evaluation_parameters: {}

# Runtime configuration
runtime_configuration:
  result_format:
    result_format: COMPLETE
    unexpected_index_column_names:
      - country
      - state
      - brewery_type
    return_unexpected_index_query: true
