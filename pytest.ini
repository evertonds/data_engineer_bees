[pytest]
# Pytest configuration for data_engineer_bees project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Ignore deprecation warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:pyspark.*
    ignore::DeprecationWarning:py4j.*

# Coverage options (when using --cov)
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
